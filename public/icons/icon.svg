  </defs>
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <rect x="40" y="40" width="432" height="432" rx="56" fill="none" stroke="#547cff" stroke-opacity="0.18" stroke-width="2"/>
  <g transform="translate(256 256)">
    <g font-family="ui-monospace, 'IBM Plex Mono', monospace" font-weight="700" text-anchor="middle" fill="#f3f1ea">
