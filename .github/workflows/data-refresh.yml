name: Refresh LCL data (manual only)

# Intended production cadence after explicit approval:
# daily 05:30 Europe/Istanbul -> 02:30 UTC
# Sunday full refresh -> 02:30 UTC
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Refresh scope
        required: true
        type: choice
        options: [daily, full]
        default: daily

permissions:
  contents: read

jobs:
  validate-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run refresh:data
        env:
          LCL_REFRESH_SCOPE: ${{ inputs.scope }}
      - run: npm run validate:data
      - name: Keep generated candidate local to this run
        run: git diff --exit-code -- public/data/v1 || true
