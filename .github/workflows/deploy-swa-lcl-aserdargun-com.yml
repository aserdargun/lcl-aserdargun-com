name: Deploy LCL to Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swa-lcl-aserdargun-com-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run validate
      - name: Verify prebuilt static artifact
        run: |
          test -f dist/index.html
          test -f dist/staticwebapp.config.json
          test -f dist/data/v1/catalog.json
          test -f dist/manifest.json
          test -f dist/changes.json
      - name: Deploy prebuilt static artifact
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SWA_LCL_ASERDARGUN_COM }}
          action: upload
          app_location: dist
          skip_app_build: true
          output_location: ""
