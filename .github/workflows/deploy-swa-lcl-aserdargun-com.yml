name: Deploy LCL to Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swa-lcl-aserdargun-com-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run validate
      - name: Verify prebuilt static artifact
        run: |
          test -f dist/index.html
          test -f dist/staticwebapp.config.json
          test -f dist/data/v1/catalog.json
          test -f dist/manifest.json
          test -f dist/changes.json
      - name: Deploy prebuilt static artifact
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1 branch head 2024-09-11
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SWA_LCL_ASERDARGUN_COM }}
          action: upload
          app_location: dist
          skip_app_build: true
          output_location: ""
